# RGB-D scan candidate for the user-confirmed Vicon area:
# x=[-2,2] m, y=[0,10] m. Nominal route offsets reach +5.0 m in Vicon Y.
# Coordinates translate to the accepted starting XY, retaining Vicon world axes.
# Start and finish at the captured position with initial raw Vicon base yaw near 0 rad, camera looking
# wheel-forward (+Y initially). Explicit /continuous_waypoint/start is required.
# There is no absolute start-position tolerance in this mode and no command
# jump to (0,0). World bounds translate with the start: X=[x0-1.2,x0+1.2],
# Y=[y0,y0+5.0]. Verify the placed route and the complete rotating robot
# footprint, stopping/tracking margin and all obstacles before using this path.
# Cross passes and overlapping lanes encourage varied views; they do not prove
# complete visibility. fixed_yaw_rad is turret world yaw, NOT chassis/camera yaw.
# The fixed camera turns with the base as the offset-drive XY controller steers.
# Existing hardware geometry, planning limits and feedback guards are retained.
continuous_waypoint:
  ros__parameters:
    points_m_flat:
    # Phase A: enter from the captured start; J is at offset (1.2,1.8).
    - 0.0
    - 0.0
    - 0.0
    - 0.8
    - 1.2
    - 0.8
    - 1.2
    - 1.8
    - 1.2
    - 2.6
    - -1.2
    - 2.6
    - -1.2
    - 3.8
    - 1.2
    - 3.8
    - 1.2
    - 5.0
    - -1.2
    - 5.0
    - -1.2
    - 0.8
    - 1.2
    - 0.8
    - 1.2
    - 1.8
    # Phase B: four longitudinal lanes, revisit J, then return to captured start.
    - 1.2
    - 5.0
    - 0.4
    - 5.0
    - 0.4
    - 0.8
    - -0.4
    - 0.8
    - -0.4
    - 5.0
    - -1.2
    - 5.0
    - -1.2
    - 0.8
    - 1.2
    - 0.8
    - 1.2
    - 1.8
    - 0.0
    - 1.8
    - 0.0
    - 0.0
    speed_m_s: 0.10
    corner_deviation_m: 0.10
    wheel_radius_m: 0.122
    half_track_m: 0.35
    base_ahead_of_axle_m: 0.301
    max_wheel_rate_rad_s: 2.9321531433504737
    planning_wheel_rate_fraction: 0.65
    planning_wheel_acceleration_rad_s2: 2.0
    planning_max_translation_acceleration_m_s2: 0.1
    planning_max_jerk_m_s3: 0.2
    fixed_yaw_rad: 0.0
    origin_mode: start_translated_vicon
    odom_topic: /HAMR_base/odom
    reference_timer_hz: 100.0
    startup_hold_s: 10.0
    final_hold_s: 10.0
    # Match the scan launch's controller_odom_timeout_s=0.20.
    odom_timeout_s: 0.20
    max_publish_gap_s: 0.08
    odom_stable_s: 0.25
    odom_recovery_samples: 10
    nominal_start_base_yaw_rad: 0.0
    start_yaw_tolerance_rad: 0.15
    start_speed_max_m_s: 0.03
    start_yaw_rate_max_rad_s: 0.1
    odom_max_position_jump_m: 0.08
    odom_max_yaw_jump_rad: 0.35
    odom_min_z_m: 0.25
    odom_max_z_m: 0.4
    odom_max_tilt_rad: 0.35
