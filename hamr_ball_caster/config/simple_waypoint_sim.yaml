# Simulation-only copy of reference_trajectory/waypoint_traj_simple.py's active
# seven points and executable v_lin default. Its separate YAML catalog defaults
# to 0.20 m/s; the Python executable defaults to 0.25 m/s, used here.
name: waypoint_traj_simple
reference_source: reference_trajectory/reference_trajectory/waypoint_traj_simple.py
speed_m_s: 0.25
fixed_turret_yaw_rad: 0.0
points_m:
  - [0.0, 0.0]
  - [0.0, 2.0]
  - [-2.0, 2.0]
  - [-2.0, 4.5]
  - [0.0, 4.5]
  - [0.0, 2.0]
  - [0.0, 0.0]
# Actual offsets in compa_ball_caster.urdf.xacro, rather than the approximate
# legacy COMPA controller geometry. Wheel axle is behind the tracked base.
wheel_radius_m: 0.1075
half_track_m: 0.33072
base_ahead_of_axle_m: 0.27114
position_gain_s_inv: 1.5
orientation_gain_s_inv: 4.0
max_translation_m_s: 0.50
max_wheel_rate_rad_s: 6.0
max_wheel_acceleration_rad_s2: 15.0
max_gimbal_rate_rad_s: 2.5
startup_hold_s: 3.0
final_hold_s: 8.0
