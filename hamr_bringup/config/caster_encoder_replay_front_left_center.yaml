# Fixed CENTER reference for front_left, device 10:bd:a3:b2:14:a4.
# Raw observations and limitations: front_left_center_calibration.json.
# Use with --start-pose recorded; ground-contact resets the first pose every run.
#
# Replay currently consumes calibrated_alpha_rad, which equals absolute_angle_rad
# in the supplied observations. This mapping requires firmware CENTER sign +1
# and zero 0 (modulo 2*pi). Adapt it if firmware calibration changes; do not apply
# the same physical zero twice. It does not change firmware or recorded data.
#
# q_model = sign * (q_encoder - zero_rad).
# Physical zero: raw 1210 counts = 0.46402918833540646 rad, H1 front/H2 back.
# Assume H1 is the positive CAD hemisphere and forward is model +X. The existing
# CAD puts that ground-contact pose at carrier joint 3.620181390266952 rad.
# Thus center_zero_rad = 0.46402918833540646 - 3.620181390266952.
# Increasing raw counts are provisionally positive; physical direction and CAD
# side assignment need verification. H1/H2 shell phases/signs remain uncalibrated.
# CENTER describes the carrier shaft rotation, not vertical-axis robot yaw.
replay_caster_encoder_joints:
  ros__parameters:
    h1_joint: caster_positive_hemisphere_joint
    h2_joint: caster_negative_hemisphere_joint
    h1_sign: 1.0
    h2_sign: 1.0
    center_sign: 1.0
    h1_zero_rad: 0.0
    h2_zero_rad: 0.0
    center_zero_rad: -3.1561522019315458
    mapping_verified: false
    stale_timeout_s: 1.0
